<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="16" fill="#1E2023"/>
  <!-- agama kolczasta / uromastyx: ciało krępe, krótkie nogi, gruby kolczasty ogon -->
  <ellipse cx="205" cy="220" rx="125" ry="11" fill="#000000" opacity="0.25"/>
  <!-- gruby, krótki, kolczasty ogon -->
  <path d="M170,195 Q110,192 75,180 Q95,205 140,208 Q158,209 172,203 Z" fill="#50C878"/>
  <!-- kolce na ogonie, rzędy trójkątów -->
  <path d="M155,192 L152,182 L160,190 Z" fill="#98FB98" opacity="0.8"/>
  <path d="M138,196 L135,186 L143,194 Z" fill="#98FB98" opacity="0.8"/>
  <path d="M120,197 L117,187 L125,195 Z" fill="#98FB98" opacity="0.8"/>
  <path d="M102,196 L99,186 L107,194 Z" fill="#98FB98" opacity="0.8"/>
  <path d="M155,204 L152,214 L160,206 Z" fill="#98FB98" opacity="0.6"/>
  <path d="M133,206 L130,216 L138,208 Z" fill="#98FB98" opacity="0.6"/>
  <!-- nogi krótkie, krępe -->
  <path d="M188,178 L168,158 L152,148" fill="none" stroke="#50C878" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M188,208 L168,228 L152,238" fill="none" stroke="#50C878" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252,176 L272,156 L288,146" fill="none" stroke="#50C878" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252,210 L272,230 L288,240" fill="none" stroke="#50C878" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- korpus krępy, szeroki -->
  <ellipse cx="222" cy="193" rx="76" ry="38" fill="#50C878"/>
  <!-- głowa mała, zaokrąglona -->
  <circle cx="286" cy="184" r="20" fill="#50C878"/>
  <circle cx="279" cy="177" r="3" fill="#98FB98"/>
  <circle cx="292" cy="177" r="3" fill="#98FB98"/>
  <!-- łuski na grzbiecie -->
  <circle cx="200" cy="172" r="3" fill="#98FB98" opacity="0.5"/>
  <circle cx="220" cy="168" r="3" fill="#98FB98" opacity="0.5"/>
  <circle cx="240" cy="170" r="3" fill="#98FB98" opacity="0.5"/>
</svg>
