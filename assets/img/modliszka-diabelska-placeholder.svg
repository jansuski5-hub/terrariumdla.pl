<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="16" fill="#1E2023"/>
  <line x1="60" y1="240" x2="340" y2="240" stroke="#50C878" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <!-- odnóża środkowe i tylne -->
  <path d="M195,175 L184,240" stroke="#50C878" stroke-width="6" stroke-linecap="round"/>
  <path d="M232,188 L228,240" stroke="#50C878" stroke-width="6" stroke-linecap="round"/>
  <path d="M272,202 L280,240" stroke="#50C878" stroke-width="6" stroke-linecap="round"/>
  <path d="M305,214 L322,240" stroke="#50C878" stroke-width="6" stroke-linecap="round"/>
  <!-- tułów -->
  <path d="M150,120 C175,145 205,168 235,182 S280,198 300,208" fill="none" stroke="#50C878" stroke-width="17" stroke-linecap="round"/>
  <!-- odwłok -->
  <ellipse cx="310" cy="214" rx="45" ry="20" fill="#50C878" transform="rotate(15 310 214)"/>
  <!-- głowa -->
  <circle cx="145" cy="105" r="15" fill="#50C878"/>
  <circle cx="137" cy="100" r="3" fill="#98FB98"/>
  <circle cx="150" cy="97" r="3" fill="#98FB98"/>
  <!-- czułki -->
  <path d="M140,88 L118,64" stroke="#98FB98" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M152,86 L162,58" stroke="#98FB98" stroke-width="2.5" stroke-linecap="round"/>
  <!-- odnóża chwytne uniesione w postawie obronnej (deimatic display) -->
  <path d="M135,115 L80,80 L60,105" fill="none" stroke="#98FB98" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M143,124 L92,95 L76,122" fill="none" stroke="#98FB98" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- kolorowe plamy ostrzegawcze na spodniej stronie ud -->
  <ellipse cx="90" cy="88" rx="9" ry="5" fill="#98FB98" opacity="0.7" transform="rotate(-35 90 88)"/>
  <ellipse cx="101" cy="102" rx="9" ry="5" fill="#98FB98" opacity="0.7" transform="rotate(-35 101 102)"/>
</svg>
