<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="16" fill="#1E2023"/>
  <!-- pyton zielony: owinięty wokół poziomej gałęzi, typowa poza spoczynkowa -->
  <rect x="55" y="118" width="290" height="16" rx="8" fill="#8B5E3C"/>
  <rect x="55" y="118" width="290" height="5" rx="2.5" fill="#A9754F"/>
  <!-- ciało w luźnych pętlach zwisających spod gałęzi -->
  <path d="M95,232 C104,182 116,138 148,128 C182,117 172,188 194,220 C207,239 232,190 242,150 C250,118 268,108 296,140"
    fill="none" stroke="#50C878" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148,128 C182,117 172,188 194,220" fill="none" stroke="#3FA866" stroke-width="15" stroke-linecap="round" opacity="0.55"/>
  <!-- jasne cętki wzdłuż grzbietu -->
  <rect x="144" y="122" width="11" height="11" fill="#98FB98" transform="rotate(45 149.5 127.5)"/>
  <rect x="189" y="199" width="10" height="10" fill="#98FB98" transform="rotate(45 194 204)"/>
  <rect x="235" y="146" width="10" height="10" fill="#98FB98" transform="rotate(45 240 151)"/>
  <rect x="107" y="168" width="9" height="9" fill="#98FB98" transform="rotate(45 111.5 172.5)" opacity="0.85"/>
  <!-- głowa oparta na wierzchu zwoju -->
  <ellipse cx="298" cy="135" rx="13" ry="10" fill="#50C878"/>
  <circle cx="303" cy="130" r="1.8" fill="#16181A"/>
  <circle cx="303" cy="130" r="0.8" fill="#98FB98"/>
  <!-- rozwidlony język -->
  <path d="M 309,138 L 320,144" stroke="#98FB98" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 320,144 L 327,140" stroke="#98FB98" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M 320,144 L 325,150" stroke="#98FB98" stroke-width="2.3" stroke-linecap="round"/>
</svg>
