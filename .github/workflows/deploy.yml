name: Deploy to cPanel (FTPS)

# Automatyczne wdrożenie na hosting cPanel przy każdym pushu do main.
# Strona jest statycznym HTML — brak kroku budowania, kopiujemy pliki 1:1.
#
# Wymagane sekrety repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — adres serwera FTPS, np. ftp.terrariumdla.pl
#   FTP_USERNAME  — login konta FTP z cPanel
#   FTP_PASSWORD  — hasło konta FTP
#   FTP_SERVER_DIR (opcjonalnie) — katalog docelowy na serwerze, domyślnie public_html/

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Wypchnij pliki przez FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/*.docx
            **/*.xlsx
            **/*.csv
